<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fold & Crease — Origami Glassmorphic Navbar</title>
  
  <!-- Google Fonts: Plus Jakarta Sans (Modern Geometric Sans-Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. RESET & BASE STYLES
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      color: #1e293b;
      background: #0f172a;
      overflow-x: hidden;
      position: relative;
    }

    /* ==========================================================================
       2. GEOMETRIC ORIGAMI BACKGROUND
       ========================================================================== */
    .origami-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 30%, #4338ca 65%, #6366f1 100%);
      overflow: hidden;
    }

    /* Vibrant Geometric Paper Polygon Facets */
    .polygon-facet {
      position: absolute;
      pointer-events: none;
      opacity: 0.25;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.3));
    }

    .facet-1 {
      top: -10%;
      left: -5%;
      width: 55vw;
      height: 55vw;
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      clip-path: polygon(0 0, 100% 20%, 60% 100%, 0% 80%);
    }

    .facet-2 {
      top: 20%;
      right: -10%;
      width: 60vw;
      height: 60vw;
      background: linear-gradient(225deg, #06b6d4, #3b82f6);
      clip-path: polygon(30% 0, 100% 40%, 70% 100%, 0 60%);
    }

    .facet-3 {
      bottom: -15%;
      left: 20%;
      width: 50vw;
      height: 50vw;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      clip-path: polygon(20% 0, 80% 10%, 100% 90%, 0% 100%);
    }

    /* Subtle Geometric Grid Mesh */
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.4;
    }

    /* Hero Demo Container */
    .hero-demo {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 140px 24px 60px;
      text-align: center;
      color: #ffffff;
    }

    .hero-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 20px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .hero-title span {
      background: linear-gradient(135deg, #a5b4fc 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: rgba(255, 255, 255, 0.8);
      max-width: 600px;
      line-height: 1.6;
      font-weight: 400;
    }

    /* ==========================================================================
       3. STRICT GLASSMORPHISM NAVBAR
       ========================================================================== */
    .glass-header {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 1140px;
      z-index: 1000;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 28px;
      
      /* STRICT GLASSMORPHISM SPECIFICATION */
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      
      /* Subtle 3D Light Edge Border */
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 999px;
      
      /* Depth & Inner Glow Shadows */
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.15),
        0 1px 0 rgba(255, 255, 255, 0.9) inset,
        0 -1px 0 rgba(0, 0, 0, 0.05) inset;
    }

    /* Brand Logo (Fold & Crease) */
    .logo-link {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #0f172a;
    }

    .origami-icon {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 4px 8px rgba(67, 56, 202, 0.3));
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .logo-link:hover .origami-icon {
      transform: rotate(15deg) scale(1.1);
    }

    .logo-text {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #0f172a;
    }

    .logo-text span {
      color: #4338ca;
      font-weight: 600;
    }

    /* Desktop Navigation Links */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
    }

    .nav-item a {
      display: inline-block;
      padding: 10px 20px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #1e293b;
      text-decoration: none;
      border-radius: 999px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    /* Interactivity: Paper Lifting & Glass Highlight Hover State */
    .nav-item a:hover {
      color: #4338ca;
      background: rgba(255, 255, 255, 0.6);
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 20px rgba(67, 56, 202, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
    }

    .nav-item a:active {
      transform: translateY(0) scale(0.98);
    }

    /* Active Link State */
    .nav-item.active a {
      background: #4338ca;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(67, 56, 202, 0.3);
    }

    .nav-item.active a:hover {
      background: #3730a3;
      color: #ffffff;
    }

    /* ==========================================================================
       4. MOBILE HAMBURGER MENU & RESPONSIVE DROPDOWN
       ========================================================================== */
    .hamburger-btn {
      display: none;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.7);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      transition: all 0.3s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .hamburger-btn span {
      display: block;
      width: 20px;
      height: 2px;
      background-color: #0f172a;
      border-radius: 2px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hamburger-btn:hover {
      background: rgba(255, 255, 255, 0.8);
      transform: scale(1.05);
    }

    /* Hamburger Toggle Active State (X Icon) */
    .hamburger-btn.is-active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }
    .hamburger-btn.is-active span:nth-child(2) {
      opacity: 0;
      transform: translateX(-10px);
    }
    .hamburger-btn.is-active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* Mobile Glass Dropdown Menu */
    .mobile-glass-menu {
      display: none;
      position: absolute;
      top: calc(100% + 12px);
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(-10px) scale(0.98);
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mobile-glass-menu.is-open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .mobile-nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mobile-nav-list a {
      display: block;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
      text-decoration: none;
      border-radius: 16px;
      transition: all 0.25s ease;
    }

    .mobile-nav-list a:hover {
      background: rgba(67, 56, 202, 0.1);
      color: #4338ca;
      transform: translateX(6px);
    }

    /* ==========================================================================
       5. MEDIA QUERIES (RESPONSIVE)
       ========================================================================== */
    @media (max-width: 868px) {
      .glass-header {
        top: 16px;
        width: calc(100% - 32px);
      }

      .glass-nav-container {
        padding: 10px 20px;
      }

      .nav-links {
        display: none; /* Hide desktop links on mobile */
      }

      .hamburger-btn {
        display: flex; /* Show hamburger icon */
      }

      .mobile-glass-menu {
        display: block; /* Enable dropdown DOM structure */
      }
    }

    @media (max-width: 480px) {
      .glass-header {
        top: 12px;
        width: calc(100% - 24px);
      }

      .logo-text {
        font-size: 1.1rem;
      }

      .origami-icon {
        width: 28px;
        height: 28px;
      }

      .hamburger-btn {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>

  <!-- Origami Geometric Polygon Background -->
  <div class="origami-bg">
    <div class="polygon-facet facet-1"></div>
    <div class="polygon-facet facet-2"></div>
    <div class="polygon-facet facet-3"></div>
    <div class="grid-pattern"></div>
  </div>

  <!-- Strict Glassmorphism Header -->
  <header class="glass-header">
    <nav class="glass-nav-container" aria-label="Main Navigation">
      
      <!-- Logo: Fold & Crease -->
      <a href="#" class="logo-link">
        <!-- SVG Origami Crane Logo Icon -->
        <svg class="origami-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 10L90 40L50 90L10 40L50 10Z" fill="#4338CA" fill-opacity="0.85"/>
          <path d="M50 10L90 40L50 55L10 40L50 10Z" fill="#6366F1"/>
          <path d="M50 55L90 40L50 90Z" fill="#3730A3"/>
          <path d="M50 55L10 40L50 90Z" fill="#4f46e5"/>
        </svg>
        <span class="logo-text">Fold <span>&amp; Crease</span></span>
      </a>

      <!-- Desktop Navigation Links -->
      <ul class="nav-links">
        <li class="nav-item active"><a href="#home">Home</a></li>
        <li class="nav-item"><a href="#gallery">Gallery</a></li>
        <li class="nav-item"><a href="#tutorials">Tutorials</a></li>
        <li class="nav-item"><a href="#shop">Shop</a></li>
        <li class="nav-item"><a href="#contact">Contact</a></li>
      </ul>

      <!-- Mobile Hamburger Button -->
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle navigation menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </nav>

    <!-- Mobile Glass Dropdown Menu -->
    <div class="mobile-glass-menu" id="mobileMenu">
      <ul class="mobile-nav-list">
        <li><a href="#home" class="mobile-link">Home</a></li>
        <li><a href="#gallery" class="mobile-link">Gallery</a></li>
        <li><a href="#tutorials" class="mobile-link">Tutorials</a></li>
        <li><a href="#shop" class="mobile-link">Shop</a></li>
        <li><a href="#contact" class="mobile-link">Contact</a></li>
      </ul>
    </div>
  </header>

  <!-- Hero Content Section for Visual Glass Verification -->
  <main class="hero-demo">
    <h1 class="hero-title">Crafting Art from <span>Single Folds.</span></h1>
    <p class="hero-subtitle">Experience our strict glassmorphic navigation design inspired by geometric origami folds, paper textures, and tactile motion dynamics.</p>
  </main>

  <!-- Interactive Mobile Toggle JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const mobileMenu = document.getElementById('mobileMenu');
      const mobileLinks = document.querySelectorAll('.mobile-link');

      const toggleMenu = () => {
        const isOpen = mobileMenu.classList.toggle('is-open');
        hamburgerBtn.classList.toggle('is-active');
        hamburgerBtn.setAttribute('aria-expanded', isOpen);
      };

      hamburgerBtn.addEventListener('click', toggleMenu);

      // Close menu when link is clicked
      mobileLinks.forEach(link => {
        link.addEventListener('click', () => {
          mobileMenu.classList.remove('is-open');
          hamburgerBtn.classList.remove('is-active');
          hamburgerBtn.setAttribute('aria-expanded', 'false');
        });
      });
    });
  </script>
</body>
</html>
